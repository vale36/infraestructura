global:
  sendAnonymousUsage: false

api:
  # El panel sale solo por su router HTTPS de config.yml (traefik.universidad.localhost),
  # sin usuario ni contraseña para no tener que ingresarlos cada vez (desarrollo).
  # insecure: false cierra el puerto 8080, donde la API quedaba abierta sin router.
  dashboard: true
  insecure: false

providers:
  consulCatalog:
    endpoint:
      address: "consul:8500"
      scheme: "http"
      datacenter: "dc1"
    refreshInterval: "10s"
    exposedByDefault: false
    strictChecks:
      - "passing"

  file:
    filename: /etc/traefik/config/config.yml
    watch: true


log:
  level: INFO
  format: common

entryPoints:
  http:
    address: ":80" #Obliga a que todo el trafico que llegue por http se redireccione a https
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
  https:
    address: ":443"