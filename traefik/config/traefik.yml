global:
  sendAnonymousUsage: true

api:
  dashboard: true #Esta asi para no obligarnos a ingresar usuario y contraseña cada vez que queramos ingresar a traefik.
  insecure: true

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    watch: true
    exposedByDefault: false

  file:
    filename: /etc/traefik/config.yml
    watch: true


log:
  level: INFO
  format: common

entryPoints:
  redis:
    address: ":6379"
  mongodb:
    address: ":27017"
  http:
    address: ":80" #Obliga a que todo el trafico que llegue por http se redireccione a https
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
  https:
    address: ":443"