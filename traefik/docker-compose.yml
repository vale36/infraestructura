services:
    reverse-proxy:
        image: traefik:v3.6
        command: ["--configFile=/etc/traefik/config/traefik.generated.yml"]
        container_name: traefik
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        ports:
            - 80:80
            - 443:443
        volumes:
            # La carpeta y no archivos sueltos: traefik.generated.yml lo escribe el
            # bootstrap de Consul (o prepare-consul-token.ps1) y puede no existir todavía
            # cuando Docker crea el contenedor.
            - ./config:/etc/traefik/config:ro
            - ./certs:/etc/certs:ro
        networks:
            - redutn 
networks:
    redutn:
        external: true